apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-fullstack-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-fullstack-app
  template:
    metadata:
      labels:
        app: devops-fullstack-app
    spec:
      containers:
        - name: devops-fullstack-app
          image: devops-fullstack-app:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000